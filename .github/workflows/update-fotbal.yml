name: Test IS FAČR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-is-facr:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test veřejného IS FAČR
        run: node scripts/scrape-fotbal.mjs
