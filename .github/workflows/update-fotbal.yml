name: Test FAČR login

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-facr-login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Test přihlášení a přehledu zápasů
        env:
          FACR_USERNAME: ${{ secrets.FACR_USERNAME }}
          FACR_PASSWORD: ${{ secrets.FACR_PASSWORD }}
        run: node scripts/scrape-fotbal.mjs
